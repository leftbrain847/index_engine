    url: https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap
    license: OFL-1.1
    license_files: [https://cdn.jsdelivr.net/npm/@fontsource/bricolage-grotesque@5.3.0/LICENSE,
                    https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.3.0/LICENSE,
                    https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.3.0/LICENSE]

  - name: fonts-linear-algebra
    kind: google-fonts
    url: https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@500;700&display=swap
    license: OFL-1.1
    license_files: [https://cdn.jsdelivr.net/npm/@fontsource/bricolage-grotesque@5.3.0/LICENSE,
                    https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.3.0/LICENSE]

  - name: fonts-lull
    kind: google-fonts
    url: https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap
    license: OFL-1.1
    license_files: [https://cdn.jsdelivr.net/npm/@fontsource/marcellus@5.3.0/LICENSE,
                    https://cdn.jsdelivr.net/npm/@fontsource/figtree@5.3.0/LICENSE,
                    https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.3.0/LICENSE]

  # ASL Translator (repo ASL_translator, web/asl-translator.html): MediaPipe hand + pose tracking, loaded by code
  # only after the viewer allows the camera. The loader script is small (self-hosted); the WebAssembly runtime and
  # both models are large and stay on their CDN, checked nightly against this lock. 0.10.35 is pinned on purpose:
  # MediaPipe 1.x posts usage logs to odml.pa.googleapis.com. Models: Google's MediaPipe model cards list them as
  # Apache-2.0 (not re-checked in this change; verify before relying on it).
  - name: mediapipe-tasks-vision-loader
    version: 0.10.35
    url: https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm/vision_wasm_internal.js
    license: Apache-2.0
    license_files: [https://cdn.jsdelivr.net/gh/google-ai-edge/mediapipe@v0.10.35/LICENSE]
    osv: {ecosystem: npm, package: '@mediapipe/tasks-vision', version: 0.10.35}

  - name: mediapipe-tasks-vision-wasm
    version: 0.10.35
    url: https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm/vision_wasm_internal.wasm
    license: Apache-2.0
    license_files: [https://cdn.jsdelivr.net/gh/google-ai-edge/mediapipe@v0.10.35/LICENSE]

  - name: mediapipe-hand-landmarker
    version: '1'
    url: https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
    license: Apache-2.0
    license_files: [https://cdn.jsdelivr.net/gh/google-ai-edge/mediapipe@v0.10.35/LICENSE]

  - name: mediapipe-pose-landmarker-lite
    version: '1'
    url: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
    license: Apache-2.0
    license_files: [https://cdn.jsdelivr.net/gh/google-ai-edge/mediapipe@v0.10.35/LICENSE]

# Loaders that build a URL in code (no literal URL to swap). `from` is the exact text in the page, `to` is its
# local replacement, `needs` = the deps (name@version) it can reach, all of which must be vendored for the swap,
# and `page_has` = the exact text that lists those versions in the page (no match, no swap).
rewrites:
  - from: "https://cdnjs.cloudflare.com/ajax/libs/tone/${VERSIONS[i]}/Tone.js"
    to: "{vendor}tone/${VERSIONS[i]}/Tone.js"
    needs: [tone@15.1.22, tone@14.8.49]
    page_has: "const VERSIONS = ['15.1.22', '14.8.49'];"

