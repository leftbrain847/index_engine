# Third-party files the public sites may load (sprint site + homepage). The ONLY source of vendored copies.
#
# Each dep is pinned: its url names an exact version (Google Fonts: the lock pins every font file's
# versioned fonts.gstatic.com URL and hash). After adding or changing a dep, run
#     python tools/vendor.py lock
# which downloads each file once, records its SHA-384 in site_deps.lock.json, and commit both files.
# At publish time every copy is re-downloaded and must match the lock, or it is not used.
#
#   name/version   shown in the license notices; local copy goes to vendor/<name>/<version>/<file>
#   url            exactly as pages write it; every occurrence is rewritten to the local copy
#   license        SPDX id; license_files = pinned URLs of the license/notice texts shipped with the copy
#   osv            package + ecosystem for the nightly vulnerability check (omit for fonts)
#   kind: google-fonts   a fonts.googleapis.com/css2 URL; its CSS and font files are self-hosted together
#
# Files over config.vendor.max_self_host_mb (index.yml) stay on the CDN (see tools/vendor.py).

deps:
  - name: three
    version: r128
    url: https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
    license: MIT
    license_files: [https://cdn.jsdelivr.net/npm/three@0.128.0/LICENSE]
    osv: {ecosystem: npm, package: three, version: 0.128.0}

  - name: tone
    version: 15.1.22
    url: https://cdnjs.cloudflare.com/ajax/libs/tone/15.1.22/Tone.js
    license: MIT
    license_files: [https://cdn.jsdelivr.net/npm/tone@15.1.22/LICENSE.md]
    osv: {ecosystem: npm, package: tone, version: 15.1.22}

  - name: tone
    version: 14.8.49
    url: https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js
    license: MIT
    license_files: [https://cdn.jsdelivr.net/npm/tone@14.8.49/LICENSE.md]
    osv: {ecosystem: npm, package: tone, version: 14.8.49}

  - name: highlight.js
    version: 11.11.1
    url: https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js
    license: BSD-3-Clause
    license_files: [https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/LICENSE]
    osv: {ecosystem: npm, package: highlight.js, version: 11.11.1}

  - name: highlight.js-python
    version: 11.11.1
    url: https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/python.min.js
    license: BSD-3-Clause
    license_files: [https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/LICENSE]

  - name: highlight.js-sql
    version: 11.11.1
    url: https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/sql.min.js
    license: BSD-3-Clause
    license_files: [https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/LICENSE]

  - name: echarts
    version: 6.1.0
    url: https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js
    license: Apache-2.0
    license_files: [https://cdn.jsdelivr.net/npm/echarts@6.1.0/LICENSE, https://cdn.jsdelivr.net/npm/echarts@6.1.0/NOTICE]
    osv: {ecosystem: npm, package: echarts, version: 6.1.0}

  # Google Fonts: same files Google serves (Chrome's woff2 set), from your own site. License texts come
  # from the Fontsource package of the same family (OFL-1.1).
  - name: fonts-pinball
    kind: google-fonts
    url: https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;700&display=swap
    license: OFL-1.1
    license_files: [https://cdn.jsdelivr.net/npm/@fontsource/bungee@5.3.0/LICENSE,
                    https://cdn.jsdelivr.net/npm/@fontsource/barlow-condensed@5.3.0/LICENSE]

  - name: fonts-instrument-serif-plex-mono
