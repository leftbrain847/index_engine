    url: https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap
    license: OFL-1.1
    license_files: [https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5.3.0/LICENSE,
                    https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5.3.0/LICENSE]

